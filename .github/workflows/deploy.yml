name: Deploy Streamlit App to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- Azure Container Registry Login ----
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      # ---- Build Docker image ----
      - name: Build Docker image
        run: docker build -t ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/url-spam-app:latest .

      # ---- Push Docker image ----
      - name: Push Docker image
        run: docker push ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/url-spam-app:latest

      # ---- Deploy to Azure Web App for Containers ----
      - name: Deploy to Azure Web App
        uses: azure/webapps-container-actions@v1
        with:
          app-name: url-spam-classifier-deployment
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: ${{ secrets.AZURE_REGISTRY_LOGIN_SERVER }}/url-spam-app:latest
